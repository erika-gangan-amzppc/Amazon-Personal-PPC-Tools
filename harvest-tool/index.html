<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPC Harvest Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../shared/theme.css">
<style>body{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../shared/ppc-lib.js"></script>
<script src="../shared/theme-toggle.js" defer></script>
<script src="../shared/gate.js" defer></script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="home-link" href="../">
      <span class="brand-mark"></span>
      <h1>PPC Harvest Tool</h1>
    </a>
    <div class="right">
      <span class="tag">Bulk + Search term report</span>
      <span id="ppcAuthSlot"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card upload-card">
    <h2 class="section-title" style="margin-top:0;">1. Upload reports</h2>
    <p class="section-sub">Nothing leaves your browser — all parsing happens locally.</p>
    <div class="upload-grid">
      <label class="drop" id="dropBulk">
        <h3>Bulk sheet <span class="required-badge">required</span></h3>
        <p>.xlsx bulk file — used to check which terms already have a dedicated keyword, so nothing gets recommended twice.</p>
        <div class="file-state" id="stateBulk">No file selected</div>
        <input type="file" id="fileBulk" accept=".xlsx,.xls">
      </label>
      <label class="drop" id="dropSearchTerm">
        <h3>Search term report <span class="required-badge">required</span></h3>
        <p>.xlsx or .csv — customer search term performance (SP and/or SB).</p>
        <div class="file-state" id="stateSearchTerm">No file selected</div>
        <input type="file" id="fileSearchTerm" accept=".xlsx,.xls,.csv">
      </label>
    </div>
    <button class="primary" id="btnGenerate" disabled>Find harvest candidates</button>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div id="reportRoot"></div>
  <footer>Generated locally — no data was uploaded to any server.</footer>
</div>

<script>
(function(){
"use strict";
const {Utils, Cols, Metrics, BulkParser, SearchTermParser, Rules, Render} = window.PPC;

function renderReport(bulk, stRows){
  const root = document.getElementById("reportRoot");
  root.innerHTML = "";
  root.style.display = "block";

  const promote = Rules.harvestToExactCandidates(bulk, stRows);
  const sameType = Rules.harvestSameMatchTypeCandidates(bulk, stRows);

  const summaryCard = Render.el("div",{class:"card"});
  Render.sectionHeader(summaryCard, "Data loaded", "Proven = 3+ orders, more than 5 impressions and more than 5 clicks — judged per campaign/ad group/match type row, never aggregated across campaigns.");
  const grid = Render.el("div",{class:"kpi-grid"});
  grid.appendChild(Render.kpiTile("Campaigns", Utils.fmtInt(bulk.campaigns.length)));
  grid.appendChild(Render.kpiTile("Search term rows", Utils.fmtInt(stRows.length)));
  grid.appendChild(Render.kpiTile("Promote to Exact", Utils.fmtInt(promote.length)));
  grid.appendChild(Render.kpiTile("Isolate, same match type", Utils.fmtInt(sameType.length)));
  summaryCard.appendChild(grid);
  root.appendChild(summaryCard);

  const promoteCard = Render.el("div",{class:"card"});
  Render.sectionHeader(promoteCard, "Strategy 1 — Promote to Exact (" + promote.length + ")",
    "Proven terms currently running in Auto/Broad/Phrase with no dedicated Exact keyword anywhere in the account. Each gets its own Exact keyword with dedicated bid and budget control.");
  if(promote.length){
    promoteCard.appendChild(Render.table(
      ["Search term","Campaign","Ad group","Current match type","Impressions","Clicks","Orders","Sales","Spend","ACOS"],
      promote.slice(0,50).map(r=>[r.searchTerm, r.campaignName, r.adGroupName, r.matchType,
        Utils.fmtInt(r.impressions), Utils.fmtInt(r.clicks), Utils.fmtInt(r.orders),
        Utils.fmtMoney(r.sales), Utils.fmtMoney(r.spend), r.sales>0?Utils.fmtPct(r.spend/r.sales):"∞"])
    ));
    if(promote.length>50) promoteCard.appendChild(Render.el("p",{class:"section-sub",html:"Showing top 50 of "+promote.length+" by sales."}));
    promoteCard.appendChild(Render.el("div",{class:"insight",html:"Remember the other half of the waterfall: once these go live as Exact keywords, negate the same term in the discovery campaign it came from — see the Negation Tool."}));
  } else {
    promoteCard.appendChild(Render.el("div",{class:"empty-state",html:"No proven terms found that don't already have a dedicated Exact keyword."}));
  }
  root.appendChild(promoteCard);

  const sameTypeCard = Render.el("div",{class:"card"});
  Render.sectionHeader(sameTypeCard, "Strategy 2 — Isolate within the same match type (" + sameType.length + ")",
    "Proven Broad or Phrase terms that don't yet have their own dedicated keyword at that same match type. Gives the term its own bid and budget without necessarily tightening all the way to Exact.");
  if(sameType.length){
    sameTypeCard.appendChild(Render.table(
      ["Search term","Campaign","Ad group","Match type","Impressions","Clicks","Orders","Sales","Spend","ACOS"],
      sameType.slice(0,50).map(r=>[r.searchTerm, r.campaignName, r.adGroupName, r.matchType,
        Utils.fmtInt(r.impressions), Utils.fmtInt(r.clicks), Utils.fmtInt(r.orders),
        Utils.fmtMoney(r.sales), Utils.fmtMoney(r.spend), r.sales>0?Utils.fmtPct(r.spend/r.sales):"∞"])
    ));
    if(sameType.length>50) sameTypeCard.appendChild(Render.el("p",{class:"section-sub",html:"Showing top 50 of "+sameType.length+" by sales."}));
  } else {
    sameTypeCard.appendChild(Render.el("div",{class:"empty-state",html:"No proven Broad/Phrase terms found that lack their own dedicated same-match-type keyword."}));
  }
  root.appendChild(sameTypeCard);

  const exportCard = Render.el("div",{class:"card"});
  const actions = Render.el("div",{class:"section-actions"});
  actions.appendChild(Render.el("h2",{class:"section-title", style:"margin:0;", html:"Export"}));
  const btn = Render.el("button",{class:"secondary"},[]);
  btn.textContent = "Download new-keyword CSV (" + (promote.length+sameType.length) + " rows)";
  btn.addEventListener("click", ()=>downloadCSV(promote, sameType));
  actions.appendChild(btn);
  exportCard.appendChild(actions);
  exportCard.appendChild(Render.el("p",{class:"section-sub", html:"Campaign, Ad Group, Match Type, Keyword Text — ready to paste into a bulk upload sheet as new Keyword rows."}));
  root.appendChild(exportCard);

  root.scrollIntoView({behavior:"smooth"});
}

function downloadCSV(promote, sameType){
  const header = ["Search Term","Source Campaign","Source Ad Group","Recommended Match Type","Strategy"];
  const lines = [header.join(",")];
  promote.forEach(r=>lines.push([r.searchTerm, r.campaignName, r.adGroupName, "Exact", "Promote to Exact"].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")));
  sameType.forEach(r=>lines.push([r.searchTerm, r.campaignName, r.adGroupName, r.matchType, "Isolate, same match type"].map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")));
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "harvest-candidates.csv";
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- APP ---------------- */
const App = (function(){
  const files = {bulk:null, searchTerm:null};

  function bindDrop(dropId, inputId, stateId, fileKey){
    const drop = document.getElementById(dropId);
    const input = document.getElementById(inputId);
    const state = document.getElementById(stateId);
    drop.addEventListener("click", ()=>input.click());
    drop.addEventListener("dragover", e=>{ e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", ()=>drop.classList.remove("drag"));
    drop.addEventListener("drop", e=>{
      e.preventDefault(); drop.classList.remove("drag");
      if(e.dataTransfer.files.length){ input.files = e.dataTransfer.files; handleFile(); }
    });
    input.addEventListener("change", handleFile);
    function handleFile(){
      const f = input.files[0];
      files[fileKey] = f || null;
      state.textContent = f ? (f.name + " — " + (f.size/1024).toFixed(0) + " KB") : "No file selected";
      state.style.color = f ? "var(--accent)" : "var(--text-muted)";
      checkReady();
    }
  }

  function checkReady(){
    document.getElementById("btnGenerate").disabled = !(files.bulk && files.searchTerm);
  }

  function setStatus(msg, isErr){
    const s = document.getElementById("statusLine");
    s.textContent = msg;
    s.className = "status-line" + (isErr ? " err" : "");
  }

  async function generate(){
    const btn = document.getElementById("btnGenerate");
    btn.disabled = true;
    setStatus("Parsing bulk sheet…");
    try{
      const bulk = await BulkParser.parse(files.bulk);
      if(!bulk.campaigns.length){
        setStatus("No campaign rows found in the bulk file — check the sheet names match Amazon's Bulk 2.0 export.", true);
        btn.disabled = false; return;
      }
      const nameMap = Rules.campaignNameToAdTypeMap(bulk.campaigns);
      setStatus("Parsing search term report…");
      const stRows = await SearchTermParser.parse(files.searchTerm, nameMap);
      setStatus("Finding harvest candidates…");
      renderReport(bulk, stRows);
      setStatus("Done.");
    } catch(err){
      console.error(err);
      setStatus("Something went wrong while parsing: " + err.message, true);
    }
    btn.disabled = false;
  }

  function init(){
    bindDrop("dropBulk","fileBulk","stateBulk","bulk");
    bindDrop("dropSearchTerm","fileSearchTerm","stateSearchTerm","searchTerm");
    document.getElementById("btnGenerate").addEventListener("click", generate);
  }

  return {init};
})();

document.addEventListener("DOMContentLoaded", App.init);
})();
</script>
</body>
</html>
