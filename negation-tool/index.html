<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPC Negation Tool</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>body{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../shared/ppc-lib.js"></script>
<script src="../shared/gate.js" defer></script>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="home-link" href="../">
      <span class="brand-mark"></span>
      <h1>PPC Negation Tool</h1>
    </a>
    <div class="right">
      <span class="tag">Bulk + Search term report</span>
      <span id="ppcAuthSlot"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card upload-card">
    <h2 class="section-title" style="margin-top:0;">1. Upload reports</h2>
    <p class="section-sub">Nothing leaves your browser — all parsing happens locally.</p>
    <div class="upload-grid">
      <label class="drop" id="dropBulk">
        <h3>Bulk sheet <span class="required-badge">required</span></h3>
        <p>.xlsx bulk file — used to find existing Exact keywords and existing negatives, so nothing gets recommended twice.</p>
        <div class="file-state" id="stateBulk">No file selected</div>
        <input type="file" id="fileBulk" accept=".xlsx,.xls">
      </label>
      <label class="drop" id="dropSearchTerm">
        <h3>Search term report <span class="required-badge">required</span></h3>
        <p>.xlsx or .csv — customer search term performance (SP and/or SB).</p>
        <div class="file-state" id="stateSearchTerm">No file selected</div>
        <input type="file" id="fileSearchTerm" accept=".xlsx,.xls,.csv">
      </label>
    </div>
    <button class="primary" id="btnGenerate" disabled>Find negation candidates</button>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div id="reportRoot"></div>
  <footer>Generated locally — no data was uploaded to any server.</footer>
</div>

<script>
(function(){
"use strict";
const {Utils, Cols, Metrics, BulkParser, SearchTermParser, Rules, Render} = window.PPC;

/* ---------------- ANALYSIS ---------------- */
const Analysis = (function(){

  // Back half of the harvest waterfall: a search term already has its own
  // dedicated Exact keyword somewhere in the account, but this row (in a
  // broader Auto/Broad/Phrase campaign) hasn't been negated yet -> still
  // competing with its own harvested keyword and re-learning the term.
  function alreadyHarvestedNegationCandidates(bulk, stRows){
    const existingExact = Rules.existingExactTexts(bulk);
    const negatedIndex = Rules.buildNegatedIndex(bulk);
    const campaignIdByName = Rules.campaignIdByName(bulk.campaigns);

    const out = [];
    for(const r of stRows){
      if(r.matchType === "EXACT") continue; // this row IS the exact target, nothing to negate against itself
      if(!existingExact.has(r.searchTerm.toLowerCase())) continue; // not harvested anywhere -- not this tool's job
      const campaignId = campaignIdByName[r.campaignName];
      if(negatedIndex.isNegated(campaignId, r.adGroupName, r.searchTerm)) continue; // already negated
      out.push(r);
    }
    return out.sort((a,b)=>b.spend-a.spend);
  }

  // Plain wasted-spend negation: zero orders, real spend, not already negated.
  function wastedSpendNegationCandidates(bulk, stRows){
    const negatedIndex = Rules.buildNegatedIndex(bulk);
    const campaignIdByName = Rules.campaignIdByName(bulk.campaigns);
    return Rules.wastedSpend(stRows).filter(r=>{
      const campaignId = campaignIdByName[r.campaignName];
      return !negatedIndex.isNegated(campaignId, r.adGroupName, r.searchTerm);
    });
  }

  function negativesSummary(bulk){
    const t = Metrics.empty();
    return {
      totalNegativeKeywords: (bulk.negatives||[]).length,
      totalNegativeTargets: (bulk.negativeTargets||[]).length
    };
  }

  return {alreadyHarvestedNegationCandidates, wastedSpendNegationCandidates, negativesSummary};
})();

/* ---------------- RENDER ---------------- */
function renderReport(bulk, stRows){
  const root = document.getElementById("reportRoot");
  root.innerHTML = "";
  root.style.display = "block";

  const harvested = Analysis.alreadyHarvestedNegationCandidates(bulk, stRows);
  const wasted = Analysis.wastedSpendNegationCandidates(bulk, stRows);
  const existingNeg = Analysis.negativesSummary(bulk);

  const summaryCard = Render.el("div",{class:"card"});
  Render.sectionHeader(summaryCard, "Data loaded", "");
  const grid = Render.el("div",{class:"kpi-grid"});
  grid.appendChild(Render.kpiTile("Campaigns", Utils.fmtInt(bulk.campaigns.length)));
  grid.appendChild(Render.kpiTile("Search term rows", Utils.fmtInt(stRows.length)));
  grid.appendChild(Render.kpiTile("Existing negative keywords", Utils.fmtInt(existingNeg.totalNegativeKeywords)));
  grid.appendChild(Render.kpiTile("Existing negative targets", Utils.fmtInt(existingNeg.totalNegativeTargets)));
  summaryCard.appendChild(grid);
  root.appendChild(summaryCard);

  const harvestCard = Render.el("div",{class:"card"});
  Render.sectionHeader(harvestCard, "Already harvested elsewhere — negate here (" + harvested.length + ")",
    "These search terms already have their own dedicated Exact keyword somewhere in the account, but this broader (Auto/Broad/Phrase) row hasn't been negated yet — it's still competing with its own harvested keyword and re-learning the term. Recommended: Negative Exact, scoped to this campaign.");
  if(harvested.length){
    harvestCard.appendChild(Render.table(
      ["Search term","Campaign","Ad group","Current match type","Impressions","Clicks","Spend"],
      harvested.slice(0,50).map(r=>[r.searchTerm, r.campaignName, r.adGroupName, r.matchType,
        Utils.fmtInt(r.impressions), Utils.fmtInt(r.clicks), Utils.fmtMoney(r.spend)])
    ));
    if(harvested.length>50) harvestCard.appendChild(Render.el("p",{class:"section-sub",html:"Showing top 50 of "+harvested.length+" by spend."}));
  } else {
    harvestCard.appendChild(Render.el("div",{class:"empty-state",html:"Nothing found — every harvested term is already negated in its discovery campaign, or nothing has been harvested yet."}));
  }
  root.appendChild(harvestCard);

  const wasteCard = Render.el("div",{class:"card"});
  Render.sectionHeader(wasteCard, "Wasted spend — negate (" + wasted.length + ")",
    "Zero orders, real spend, not already negated. Judged on dollars spent, not click volume. Recommended: Negative Exact for the specific term.");
  if(wasted.length){
    const total = wasted.reduce((s,r)=>s+r.spend,0);
    wasteCard.appendChild(Render.el("p",{class:"section-sub",html:"Total: "+Utils.fmtMoney(total)}));
    wasteCard.appendChild(Render.table(
      ["Search term","Campaign","Ad group","Match type","Impressions","Clicks","Spend"],
      wasted.slice(0,50).map(r=>[r.searchTerm, r.campaignName, r.adGroupName, r.matchType,
        Utils.fmtInt(r.impressions), Utils.fmtInt(r.clicks), Utils.fmtMoney(r.spend)])
    ));
    if(wasted.length>50) wasteCard.appendChild(Render.el("p",{class:"section-sub",html:"Showing top 50 of "+wasted.length+" by spend."}));
  } else {
    wasteCard.appendChild(Render.el("div",{class:"empty-state",html:"No wasted spend found that isn't already negated."}));
  }
  root.appendChild(wasteCard);

  const all = [...harvested, ...wasted];
  const exportCard = Render.el("div",{class:"card"});
  const actions = Render.el("div",{class:"section-actions"});
  actions.appendChild(Render.el("h2",{class:"section-title", style:"margin:0;", html:"Export"}));
  const btn = Render.el("button",{class:"secondary"},[]);
  btn.textContent = "Download negative keyword CSV (" + all.length + " rows)";
  btn.addEventListener("click", ()=>downloadCSV(all));
  actions.appendChild(btn);
  exportCard.appendChild(actions);
  exportCard.appendChild(Render.el("p",{class:"section-sub", html:"Campaign, Ad Group, Negative Exact keyword text — ready to paste into a bulk upload sheet."}));
  root.appendChild(exportCard);

  root.scrollIntoView({behavior:"smooth"});
}

function downloadCSV(rows){
  const header = ["Campaign Name","Ad Group Name","Match Type","Keyword Text"];
  const lines = [header.join(",")];
  const seen = new Set();
  rows.forEach(r=>{
    const key = r.campaignName+"||"+r.adGroupName+"||"+r.searchTerm.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    const cells = [r.campaignName, r.adGroupName, "Negative Exact", r.searchTerm].map(c=>'"'+String(c).replace(/"/g,'""')+'"');
    lines.push(cells.join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "negative-keywords.csv";
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- APP ---------------- */
const App = (function(){
  const files = {bulk:null, searchTerm:null};

  function bindDrop(dropId, inputId, stateId, fileKey){
    const drop = document.getElementById(dropId);
    const input = document.getElementById(inputId);
    const state = document.getElementById(stateId);
    drop.addEventListener("click", ()=>input.click());
    drop.addEventListener("dragover", e=>{ e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", ()=>drop.classList.remove("drag"));
    drop.addEventListener("drop", e=>{
      e.preventDefault(); drop.classList.remove("drag");
      if(e.dataTransfer.files.length){ input.files = e.dataTransfer.files; handleFile(); }
    });
    input.addEventListener("change", handleFile);
    function handleFile(){
      const f = input.files[0];
      files[fileKey] = f || null;
      state.textContent = f ? (f.name + " — " + (f.size/1024).toFixed(0) + " KB") : "No file selected";
      state.style.color = f ? "var(--accent)" : "var(--text-muted)";
      checkReady();
    }
  }

  function checkReady(){
    document.getElementById("btnGenerate").disabled = !(files.bulk && files.searchTerm);
  }

  function setStatus(msg, isErr){
    const s = document.getElementById("statusLine");
    s.textContent = msg;
    s.className = "status-line" + (isErr ? " err" : "");
  }

  async function generate(){
    const btn = document.getElementById("btnGenerate");
    btn.disabled = true;
    setStatus("Parsing bulk sheet…");
    try{
      const bulk = await BulkParser.parse(files.bulk);
      if(!bulk.campaigns.length){
        setStatus("No campaign rows found in the bulk file — check the sheet names match Amazon's Bulk 2.0 export.", true);
        btn.disabled = false; return;
      }
      const nameMap = Rules.campaignNameToAdTypeMap(bulk.campaigns);
      setStatus("Parsing search term report…");
      const stRows = await SearchTermParser.parse(files.searchTerm, nameMap);
      setStatus("Finding negation candidates…");
      renderReport(bulk, stRows);
      setStatus("Done.");
    } catch(err){
      console.error(err);
      setStatus("Something went wrong while parsing: " + err.message, true);
    }
    btn.disabled = false;
  }

  function init(){
    bindDrop("dropBulk","fileBulk","stateBulk","bulk");
    bindDrop("dropSearchTerm","fileSearchTerm","stateSearchTerm","searchTerm");
    document.getElementById("btnGenerate").addEventListener("click", generate);
  }

  return {init};
})();

document.addEventListener("DOMContentLoaded", App.init);
})();
</script>
</body>
</html>
